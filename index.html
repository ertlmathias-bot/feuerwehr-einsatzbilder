<body>
<header class="site-header">
 <div class="header-inner">
   <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
   <h1>Einsatzbild erstellen</h1>
 </div>
</header>
<main class="page">
 <div class="app-grid">
   <section class="panel editor" aria-labelledby="editor-heading">
     <div class="panel-heading"><h3 id="editor-heading">Einsatzdaten</h3></div>
     <div class="fields-grid">
       <label class="field"><span>Einsatznummer</span><input id="number" type="number" min="1" max="9999" value="" placeholder="z. B. 51" inputmode="numeric" autocomplete="off"></label>
       <label class="field"><span>Jahr</span><input id="year" type="number" min="2000" max="2100" value="2026" inputmode="numeric"></label>
       <label class="field wide"><span>Stichwort</span><input id="keyword" class="input-uppercase" type="text" value="" placeholder="z. B. B3 oder THL P" autocomplete="off"></label>
       <label class="field wide"><span>Schlagwort / Beschreibung</span><input id="descriptor" class="input-uppercase" type="text" value="" maxlength="90" placeholder="z. B. Brand im Gebäude" autocomplete="off"></label>
       <label class="field wide"><span>Feuerwehr / Ort</span><input id="sender" class="input-uppercase" type="text" value="" maxlength="45" placeholder="z. B. Musterstadt" autocomplete="off" required></label>
     </div>
     <div class="section-rule"></div>
     <div class="panel-heading"><h3>Foto auswählen</h3></div>
     <div class="upload-zone" id="drop-zone">
       <input type="file" id="photo-upload" accept="image/png,image/jpeg,image/webp,image/heic,image/heif" aria-label="Eigenes Foto auswählen">
       <label for="photo-upload" class="upload-label"><span class="upload-icon" aria-hidden="true">+</span><span><strong>Eigenes Foto auswählen</strong></span></label>
     </div>
     <div class="asset-grid" id="gallery-grid" role="group" aria-label="Hintergrund auswählen">
       <button class="asset" id="preset-neutral-red" type="button" aria-pressed="false"><span class="asset-swatch red" aria-hidden="true"></span><span>Rot</span></button>
       <button class="asset active" id="preset-neutral-dark" type="button" aria-pressed="true"><span class="asset-swatch dark" aria-hidden="true"></span><span>Dunkel</span></button>
     </div>
     <div class="photo-tools" id="photo-tools" hidden>
       <div class="zoom-row"><label for="zoom">Fotoausschnitt</label><input id="zoom" type="range" min="1" max="2.4" step="0.01" value="1"><button id="reset-position" class="text-button" type="button">Zurücksetzen</button></div>
       <div class="position-controls" aria-label="Bildausschnitt verschieben">
         <label><span>↔ Horizontal</span><input id="pan-horizontal" type="range" min="-1" max="1" step="0.01" value="0" aria-label="Bild horizontal verschieben"></label>
         <label><span>↕ Vertikal</span><input id="pan-vertical" type="range" min="-1" max="1" step="0.01" value="0" aria-label="Bild vertikal verschieben"></label>
       </div>
     </div>
     <label class="checkline"><input id="symbol" type="checkbox" checked><span><strong>Symbolbild</strong></span></label>
     <div class="download-area">
       <button class="primary-button" id="share-png" type="button">Teilen / In Fotos sichern ↗</button>
       <button class="secondary-button" id="download-png" type="button">PNG herunterladen ↓</button>
       <p id="export-message" role="status" aria-live="polite"></p>
     </div>
   </section>
   <section class="preview-column" aria-labelledby="preview-heading">
     <div class="preview-heading"><h3 id="preview-heading">Vorschau</h3><span>1080 × 1350 px</span></div>
     <div class="canvas-wrap"><canvas id="preview" width="1080" height="1350" aria-label="Vorschau des Einsatzbildes" role="img"></canvas></div>
   </section>
 </div>
</main>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const canvas = $('preview');
  const ctx = canvas.getContext('2d', { alpha: false });
  const W = canvas.width;
  const H = canvas.height;
  const state = {
    number: '', year: String(new Date().getFullYear()), keyword: '', descriptor: '', symbol: true,
    mode: 'neutral-dark', image: null, zoom: 1, panX: 0, panY: 0, sender: '',
    ready: false, uploadUrl: null, source: 'neutral', galleryName: null
  };
  const overlay = new Image();
  const nodes = {
    neutralRed: $('preset-neutral-red'), neutralDark: $('preset-neutral-dark')
  };

  function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
  function setMode(mode) {
    state.mode = mode;
    Object.entries(nodes).forEach(([key, button]) => {
      const selected = ({ neutralRed: 'neutral-red', neutralDark: 'neutral-dark' })[key] === mode;
      button.classList.toggle('active', selected);
      button.setAttribute('aria-pressed', String(selected));
    });
    document.querySelectorAll('[data-gallery-name]').forEach(button => {
      const active = mode === 'photo' && state.source === 'gallery' && state.galleryName === button.dataset.galleryName;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    $('zoom').disabled = mode !== 'photo';
    $('reset-position').disabled = mode !== 'photo';
    $('photo-tools').hidden = mode !== 'photo';
    canvas.classList.toggle('photo-draggable', mode === 'photo');
    draw();
  }
  // Die Galerie wird automatisch aus dem GitHub-Ordner "bilder" eingelesen.
  // Neue Fotos erscheinen nach dem Hochladen ohne Änderung an index.html oder am Link.
  const GALLERY_API = 'https://api.github.com/repos/ertlmathias-bot/feuerwehr-einsatzbilder/contents/bilder';
  function galleryPhotoUrl(photo) {
    return './bilder/' + encodeURIComponent(photo.name) + '?v=' + encodeURIComponent(photo.sha || '1');
  }
  function photoLabel(filename) {
    return filename.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 55);
  }
  function useGalleryPhoto(photo) {
    const img = new Image();
    img.onload = () => {
      state.source = 'gallery';
      state.galleryName = photo.name;
      state.image = img;
      state.zoom = 1;
      state.panX = 0;
      state.panY = 0;
      $('zoom').value = '1';
      $('pan-horizontal').value = '0'; $('pan-vertical').value = '0';
      setMode('photo');
    };
    img.onerror = () => { alert('Das Galeriebild konnte gerade nicht geladen werden. Bitte ein anderes Foto wählen.'); };
    img.src = galleryPhotoUrl(photo);
  }
  async function loadGallery() {
    try {
      const response = await fetch(GALLERY_API, {headers: {'Accept':'application/vnd.github+json'}, cache:'no-store'});
      if (!response.ok) return;
      const files = await response.json();
      if (!Array.isArray(files)) return;
      const photos = files.filter(file => file.type === 'file' && /\.(jpe?g|png|webp)$/i.test(file.name))
        .sort((a,b) => a.name.localeCompare(b.name, 'de'));
      for (const photo of photos) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'asset';
        button.dataset.galleryName = photo.name;
        button.setAttribute('aria-pressed', 'false');
        button.setAttribute('aria-label', 'Galeriebild ' + photoLabel(photo.name) + ' auswählen');
        const img = document.createElement('img');
        img.src = galleryPhotoUrl(photo);
        img.alt = '';
        img.loading = 'lazy';
        const caption = document.createElement('span');
        caption.textContent = photoLabel(photo.name);
        button.append(img, caption);
        button.addEventListener('click', () => useGalleryPhoto(photo));
        $('gallery-grid').appendChild(button);
      }
    } catch (_) {
      // Galerie optional: Eigene Fotos und neutrale Hintergründe bleiben nutzbar.
    }
  }
  function neutralBackground(mode) {
    const dark = mode === 'neutral-dark';
    const gradient = ctx.createLinearGradient(0, 0, W, H);
    gradient.addColorStop(0, dark ? '#283748' : '#56151e');
    gradient.addColorStop(.53, dark ? '#17212e' : '#a01626');
    gradient.addColorStop(1, '#111b26');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = .15;
    ctx.translate(W * .32, H * .37);
    ctx.rotate(-.28);
    ctx.fillStyle = dark ? '#e6eaf0' : '#ffb4b6';
    ctx.fillRect(-450, -260, 990, 165);
    ctx.fillRect(-450, -40, 990, 20);
    ctx.fillRect(-450, 15, 990, 8);
    ctx.restore();
    ctx.save();
    ctx.font = '900 460px Arial, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.055)';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('112', 250, 710);
    ctx.restore();
  }
  function photoBox() {
    if (!state.image || !state.image.naturalWidth || !state.image.naturalHeight) return null;
    const img = state.image;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const ratio = W / H;
    let cropW, cropH;
    if (iw / ih > ratio) { cropW = ih * ratio; cropH = ih; }
    else { cropW = iw; cropH = iw / ratio; }
    cropW /= state.zoom;
    cropH /= state.zoom;
    const availX = iw - cropW, availY = ih - cropH;
    const x = clamp(availX * (.5 + state.panX / 2), 0, availX);
    const y = clamp(availY * (.5 + state.panY / 2), 0, availY);
    return { x, y, cropW, cropH, availX, availY };
  }
  function drawPhoto() {
    if (!state.image || !state.image.complete) {
      neutralBackground('neutral-dark');
      return;
    }
    const box = photoBox();
    if (!box) { neutralBackground('neutral-dark'); return; }
    ctx.drawImage(state.image, box.x, box.y, box.cropW, box.cropH, 0, 0, W, H);
  }
  function fittingText(text, maxSize, minSize, maxWidth, weight) {
    let size = maxSize;
    while (size > minSize) {
      ctx.font = `${weight} ${size}px Arial, Helvetica, sans-serif`;
      if (ctx.measureText(text).width <= maxWidth) break;

  function draw() {

    if (state.mode === 'photo') drawPhoto();

    const headline = `${state.number || '–'}. EINSATZ ${state.year || '–'}`;
    const headlineSize = fittingText(headline, 103, 54, 970, 900);
    ctx.font = `900 ${headlineSize}px Arial, Helvetica, sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.shadowColor = 'rgba(0,0,0,.17)';
    ctx.shadowBlur = 9;
    ctx.fillText(headline, 57, 1010);
    ctx.shadowBlur = 0;
    const key = (state.keyword || '–').toLocaleUpperCase('de-DE');
    const description = state.descriptor.trim().toLocaleUpperCase('de-DE');
    const subtitle = `Stichwort ${key}${description ? ` - ${description}` : ''}`;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    // Lange Schlagwörter auf maximal zwei Zeilen umbrechen, statt sie unlesbar zu verkleinern.
    const maxSubtitleWidth = 962;
    let subtitleSize = fittingText(subtitle, 51, 34, maxSubtitleWidth, 500);
    let subtitleLines = [subtitle];
    ctx.font = `500 ${subtitleSize}px Arial, Helvetica, sans-serif`;
    if (ctx.measureText(subtitle).width > maxSubtitleWidth) {
      subtitleSize = 36;
      ctx.font = `500 ${subtitleSize}px Arial, Helvetica, sans-serif`;
      const words = subtitle.split(/\s+/);
      subtitleLines = [];
      let line = '';
      for (const word of words) {
        const proposed = line ? `${line} ${word}` : word;
        if (line && ctx.measureText(proposed).width > maxSubtitleWidth) {
          subtitleLines.push(line);
          line = word;
        } else line = proposed;
      }
      if (line) subtitleLines.push(line);
      if (subtitleLines.length > 2) {
        // Im Extremfall die Schrift so weit verkleinern, bis zwei Zeilen genügen.
        while (subtitleLines.length > 2 && subtitleSize > 21) {

          ctx.font = `500 ${subtitleSize}px Arial, Helvetica, sans-serif`;
          subtitleLines = [];

          for (const word of words) {

            if (newLine && ctx.measureText(proposed).width > maxSubtitleWidth) {

              newLine = word;
            } else newLine = proposed;
          }
          if (newLine) subtitleLines.push(newLine);

    const footer = state.sender.trim() ? `FREIWILLIGE FEUERWEHR ${state.sender.trim().toLocaleUpperCase('de-DE')}` : 'FREIWILLIGE FEUERWEHR · ORT EINGEBEN';
    // Die drei Designbalken sind etwa 25 px hoch und bei y = 1304 mittig ausgerichtet.

    const footerSize = fittingText(footer, 29, 14, 700, 700);
    ctx.font = `700 ${footerSize}px Arial, Helvetica, sans-serif`;
    ctx.fillStyle = '#f2f4f7';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(footer, 116, 1304);
    if (state.symbol) {
      ctx.fillStyle = '#f2f4f7';
      ctx.font = '600 29px Arial, Helvetica, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('SYMBOLBILD', 1022, 1304);
    }

  }

  function bindValue(id, key) {
    $(id).addEventListener('input', (event) => {
      state[key] = String(event.target.value).trim();
      draw();
    });
  }
  $('year').value = state.year;
  bindValue('number', 'number');
  bindValue('year', 'year');
  bindValue('keyword', 'keyword');
  bindValue('descriptor', 'descriptor');
  // Keine Vorbelegung: Der Absender muss bei jedem neuen Einsatz neu eingegeben werden.
  $('sender').value = '';
  $('sender').addEventListener('input', (event) => {
    state.sender = String(event.target.value).slice(0, 45);
    draw();
  });
  $('symbol').addEventListener('change', e => { state.symbol = e.target.checked; draw(); });
  nodes.neutralRed.addEventListener('click', () => setMode('neutral-red'));
  nodes.neutralDark.addEventListener('click', () => setMode('neutral-dark'));
  $('zoom').addEventListener('input', (event) => { state.zoom = Number(event.target.value); draw(); });
  $('pan-horizontal').addEventListener('input', (event) => { state.panX = Number(event.target.value); draw(); });
  $('pan-vertical').addEventListener('input', (event) => { state.panY = Number(event.target.value); draw(); });
  $('reset-position').addEventListener('click', () => {
    state.panX = 0; state.panY = 0;
    state.zoom = 1; $('zoom').value = '1';
    $('pan-horizontal').value = '0'; $('pan-vertical').value = '0'; draw();
  });

  const fileInput = $('photo-upload');
  function handleFile(file) {
    if (!file) return;
    if (!file.type.startsWith('image/') && !/\.(heic|heif|jpe?g|png|webp)$/i.test(file.name)) {
      window.alert('Bitte eine Bilddatei auswählen.'); return;
    }
    if (file.size > 35 * 1024 * 1024) {
      window.alert('Die Datei ist sehr groß. Bitte ein Bild unter 35 MB auswählen.'); return;
    }
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      if (state.uploadUrl) URL.revokeObjectURL(state.uploadUrl);
      state.uploadUrl = url;
      state.image = image;
      state.source = 'upload';
      state.galleryName = null;
      state.zoom = 1; state.panX = 0; state.panY = 0;
      $('zoom').value = '1';
      $('pan-horizontal').value = '0'; $('pan-vertical').value = '0';
      setMode('photo');
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      window.alert('Dieses Bildformat kann dein Browser nicht öffnen. Bitte als JPG oder PNG speichern und erneut versuchen.');
    };
    image.src = url;
  }
  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
  const zone = $('drop-zone');
  ['dragenter','dragover'].forEach(eventName => zone.addEventListener(eventName, e => {
    e.preventDefault(); zone.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(eventName => zone.addEventListener(eventName, e => {
    e.preventDefault(); zone.classList.remove('dragover');
  }));
  zone.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));

  // Drag the visible photo to reframe it without editing the source file.
  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    // Touch-Gesten bleiben dem Browser vorbehalten, damit man auf der Vorschau scrollen kann.
    if (e.pointerType === 'touch' || state.mode !== 'photo' || !photoBox()) return;
    drag = { x: e.clientX, y: e.clientY, panX: state.panX, panY: state.panY };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const box = photoBox();
    if (!box) return;
    const rect = canvas.getBoundingClientRect();
    const dx = (e.clientX - drag.x) / rect.width;
    const dy = (e.clientY - drag.y) / rect.height;
    if (box.availX > 0) state.panX = clamp(drag.panX - dx * (2 * box.cropW / box.availX), -1, 1);
    if (box.availY > 0) state.panY = clamp(drag.panY - dy * (2 * box.cropH / box.availY), -1, 1);
    $('pan-horizontal').value = String(state.panX);
    $('pan-vertical').value = String(state.panY);
    draw();
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(name => canvas.addEventListener(name, () => { drag = null; }));

  function exportReady() {
    if (!String(state.number).trim() || !String(state.keyword).trim() || !String(state.descriptor).trim()) {
      window.alert('Bitte Einsatznummer, Stichwort und Schlagwort eingeben.');
      (!String(state.number).trim() ? $('number') : !String(state.keyword).trim() ? $('keyword') : $('descriptor')).focus();
      return false;
    }
    if (!String(state.sender).trim()) {
      window.alert('Bitte die Feuerwehr bzw. den Ort eingeben.');
      $('sender').focus();
      return false;
    }
    const year = Number(state.year);
    if (!Number.isInteger(year) || year < 2000 || year > 2100) {
      window.alert('Bitte ein gültiges Jahr eingeben.');
      $('year').focus();
      return false;
    }
    const number = Number(state.number);
    if (!Number.isInteger(number) || number < 1 || number > 9999) {
      window.alert('Bitte eine gültige Einsatznummer eingeben.');
      $('number').focus();
      return false;
    }
    if (state.mode === 'photo' && (!state.image || !state.image.complete)) {
      window.alert('Bitte warte, bis das Hintergrundbild geladen ist.'); return false;
    }
    if (!overlay.complete || !overlay.naturalWidth) {
      window.alert('Die Gestaltungsvorlage wurde noch nicht geladen.'); return false;
    }
    return true;
  }
  function exportName(type) {
    return `Einsatz-${String(state.number || '000').replace(/[^\d]/g,'')}-${String(state.year || '').replace(/[^\d]/g,'')}.png`;
  }
  function canvasBlob(type) {
    draw();
    return new Promise(resolve => canvas.toBlob(resolve, type, type === 'image/jpeg' ? .94 : undefined));
  }
  function saveBlob(blob, filename) {
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
  }
  async function download(type) {
    if (!exportReady()) return;
    const blob = await canvasBlob(type);
    if (!blob) { window.alert('Der Bildexport hat nicht funktioniert.'); return; }
    saveBlob(blob, exportName(type));
    $('export-message').textContent = 'PNG gespeichert. Auf dem iPhone findest du die Datei unter Downloads in der Dateien-App.';
  }
  // PNG synchron erzeugen, damit Safari die Teilen-Aktion als direkten Klick erkennt.
  function pngBlobForShare() {
    draw();
    const data = canvas.toDataURL('image/png');
    const base64 = data.slice(data.indexOf(',') + 1);
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], {type:'image/png'});
  }
  async function shareImage() {
    if (!exportReady()) return;
    let blob;
    try { blob = pngBlobForShare(); }
    catch (_) { window.alert('Das Bild konnte nicht erstellt werden.'); return; }
    const name = exportName('image/png');
    const file = new File([blob], name, {type:'image/png'});
    try {
      if (navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))) {
        await navigator.share({files:[file],title:'Einsatzbild'});
        $('export-message').textContent = 'Im Teilen-Menü kannst du das Bild versenden oder in Fotos sichern.';
      } else {
        saveBlob(blob, name);
        $('export-message').textContent = 'Das Teilen-Menü ist hier nicht verfügbar. Die PNG-Datei wurde heruntergeladen.';
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      saveBlob(blob, name);
      $('export-message').textContent = 'Teilen war nicht möglich. Die PNG-Datei wurde heruntergeladen.';
    }
  }
  $('share-png').addEventListener('click', shareImage);
  $('download-png').addEventListener('click', () => download('image/png'));
  loadGallery();
  draw();
})();

</script>
